<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0f" />
      <stop offset="50%" stop-color="#0e121a" />
      <stop offset="100%" stop-color="#090b10" />
    </linearGradient>

    <!-- Accent Glow -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="indigoGlow" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Blueprint Grid -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Style definition for fonts -->
    <style>
      .title-name { font-family: 'Inter', -apple-system, sans-serif; font-weight: 800; font-size: 54px; fill: #ffffff; letter-spacing: -1px; }
      .role-badge { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 20px; fill: #38bdf8; letter-spacing: 2px; }
      .subtext { font-family: 'Inter', -apple-system, sans-serif; font-size: 24px; fill: #94a3b8; font-weight: 400; }
      .tag { font-family: 'JetBrains Mono', monospace; font-size: 16px; fill: #cbd5e1; }
      .mono-meta { font-family: 'JetBrains Mono', monospace; font-size: 18px; fill: #64748b; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#cyanGlow)" />
  <rect width="1200" height="630" fill="url(#indigoGlow)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Card Frame -->
  <rect x="50" y="50" width="1100" height="530" rx="16" fill="rgba(15, 18, 26, 0.7)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

  <!-- Corner Accent Brackets -->
  <path d="M 50 80 L 50 50 L 80 50" fill="none" stroke="#38bdf8" stroke-width="3" />
  <path d="M 1150 80 L 1150 50 L 1120 50" fill="none" stroke="#38bdf8" stroke-width="3" />
  <path d="M 50 550 L 50 580 L 80 580" fill="none" stroke="#38bdf8" stroke-width="3" />
  <path d="M 1150 550 L 1150 580 L 1120 580" fill="none" stroke="#38bdf8" stroke-width="3" />

  <!-- Status Pill Header -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="280" height="38" rx="19" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
    <circle cx="20" cy="19" r="5" fill="#38bdf8" />
    <text x="36" y="25" class="role-badge">FULL-STACK DEVELOPER</text>
  </g>

  <!-- Main Identity Name -->
  <text x="100" y="210" class="title-name">SHAHIN SHA</text>
  <text x="100" y="275" class="title-name" fill="#94a3b8">CHAKKINGATHODI</text>

  <!-- Tagline / Bio -->
  <text x="100" y="340" class="subtext">Computer Science engineering student building practical web applications</text>
  <text x="100" y="375" class="subtext">and exploring Cloud &amp; DevOps architectures.</text>

  <!-- Tech Stack Badges -->
  <g transform="translate(100, 425)">
    <g transform="translate(0, 0)">
      <rect width="115" height="36" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="18" y="24" class="tag">TypeScript</text>
    </g>
    <g transform="translate(130, 0)">
      <rect width="85" height="36" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="18" y="24" class="tag">React</text>
    </g>
    <g transform="translate(230, 0)">
      <rect width="100" height="36" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="18" y="24" class="tag">Next.js</text>
    </g>
    <g transform="translate(345, 0)">
      <rect width="100" height="36" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="18" y="24" class="tag">Node.js</text>
    </g>
    <g transform="translate(460, 0)">
      <rect width="125" height="36" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="18" y="24" class="tag">PostgreSQL</text>
    </g>
    <g transform="translate(600, 0)">
      <rect width="90" height="36" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="18" y="24" class="tag">Docker</text>
    </g>
  </g>

  <!-- Footer Metadata & Social Signals -->
  <line x1="100" y1="495" x2="1100" y2="495" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <text x="100" y="535" class="mono-meta">GITHUB: github.com/Shahinshac</text>
  <text x="750" y="535" class="mono-meta">PORTFOLIO: shahinshac.vercel.app</text>
</svg>
